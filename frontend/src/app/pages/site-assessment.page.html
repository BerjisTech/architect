<section class="container section">
  <h1 class="text-2xl font-semibold text-slate-900">Site Assessment</h1>
  <p class="mt-2 max-w-2xl text-sm text-slate-600">Upload property documents, survey maps, soil tests, zoning certificates.</p>
  <div class="mt-6 grid gap-4 max-w-2xl rounded-3xl border border-slate-200 bg-white/90 p-6 elev-soft">
  <label class="block">
    <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Select files</span>
    <input type="file" multiple class="mt-1" (change)="onFiles($event)" />
  </label>
  <ul class="list-disc pl-5 text-sm text-slate-700" *ngIf="files.length">
    <li *ngFor="let f of files">{{f.name}} ({{f.size}} bytes)</li>
  </ul>
  <button class="btn-primary w-max" (click)="submit()">Submit</button>
  <p *ngIf="message" class="text-sm text-green-700">{{message}}</p>
  </div>
</section>
