<section class="container section">
  <h1 class="text-2xl font-semibold text-slate-900">Professional Matching</h1>
  <p class="mt-2 max-w-2xl text-sm text-slate-600">Curated teams matched to your scope, style, location, and budget.</p>
  <div class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <div class="rounded-2xl border border-slate-200 bg-white/90 p-4 elev-soft hover-rise" *ngFor="let p of demo">
      <div class="text-sm font-semibold text-slate-900">{{p.name}}</div>
      <div class="text-xs text-slate-600">{{p.specialty}} · {{p.city}}</div>
      <button class="mt-3 btn-ghost">View Profile</button>
    </div>
  </div>
</section>
