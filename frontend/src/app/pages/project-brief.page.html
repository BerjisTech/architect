<section class="container section">
  <h1 class="text-2xl font-semibold text-slate-900">Project Brief</h1>
  <p class="mt-2 max-w-2xl text-sm text-slate-600">Define scope, budget, timeline, and context to align the entire team.</p>

  <form class="mt-6 grid gap-4 max-w-3xl rounded-3xl border border-slate-200 bg-white/90 p-6 elev-soft" (ngSubmit)="save()">
  <label class="grid gap-1">
    <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Project Type</span>
    <select class="rounded-xl border border-slate-200 px-3 py-2 text-sm" [(ngModel)]="model.type" name="type">
      <option value="residential">Residential</option>
      <option value="commercial">Commercial</option>
      <option value="industrial">Industrial</option>
      <option value="mixed">Mixed-use</option>
    </select>
  </label>
  <label class="grid gap-1">
    <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Budget Range (USD)</span>
    <input class="rounded-xl border border-slate-200 px-3 py-2 text-sm" [(ngModel)]="model.budget" name="budget" placeholder="e.g., 200k - 500k" />
  </label>
  <label class="grid gap-1">
    <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Timeline</span>
    <input class="rounded-xl border border-slate-200 px-3 py-2 text-sm" [(ngModel)]="model.timeline" name="timeline" placeholder="e.g., 12 months" />
  </label>
  <label class="grid gap-1">
    <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Location</span>
    <input class="rounded-xl border border-slate-200 px-3 py-2 text-sm" [(ngModel)]="model.location" name="location" placeholder="City, Country" />
  </label>
  <label class="grid gap-1">
    <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Lot Details</span>
    <textarea class="rounded-xl border border-slate-200 px-3 py-2 text-sm" [(ngModel)]="model.lot" name="lot" placeholder="Area, frontage, access..."></textarea>
  </label>
  <label class="grid gap-1">
    <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Zoning Information</span>
    <textarea class="rounded-xl border border-slate-200 px-3 py-2 text-sm" [(ngModel)]="model.zoning" name="zoning" placeholder="Zoning code, FAR, height limits..."></textarea>
  </label>

  <div class="flex items-center gap-3">
    <button type="submit" class="btn-primary">Save Draft</button>
    <span class="text-xs text-slate-500" *ngIf="savedAt">Saved {{savedAt}}</span>
  </div>
  </form>
</section>
