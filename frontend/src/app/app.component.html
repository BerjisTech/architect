<div
  class="min-h-screen flex flex-col bg-app-gradient bg-app-gradient-animated text-[color:var(--color-text-primary)] dark:text-[color:var(--color-text-dark)]">
  <button type="button" (click)="toggleTheme()"
    class="fixed top-4 right-4 z-50 rounded-full p-3 backdrop-blur shadow-brand bg-white/80 text-blue-900 hover:bg-white dark:bg-slate-800/80 dark:text-[color:var(--color-gold)]"
    aria-label="Toggle theme">
    <span class="material-symbols-outlined align-middle">{{ isDark ? 'light_mode' : 'dark_mode' }}</span>
  </button>
  <header class="w-full border-b border-slate-200 bg-white/90 backdrop-blur">
    <nav class="flex items-center gap-6 px-6 py-4">
      <a routerLink="/" class="text-xl font-semibold text-slate-900">Architect</a>
      <a routerLink="/project-brief" class="text-sm text-slate-600 hover:text-slate-900">Project Brief</a>
      <a routerLink="/site-assessment" class="text-sm text-slate-600 hover:text-slate-900">Site Assessment</a>
      <a routerLink="/matching" class="text-sm text-slate-600 hover:text-slate-900">Matching</a>
      <a routerLink="/consultation" class="text-sm text-slate-600 hover:text-slate-900">Consultation</a>
      <a routerLink="/regulatory-checklist" class="text-sm text-slate-600 hover:text-slate-900">Checklist</a>
      <a routerLink="/studio" class="text-sm text-slate-600 hover:text-slate-900">Studio</a>
      <span class="ml-auto text-xs text-slate-500"><a href="/api/v1/health" class="underline">Core API</a> · <a
          href="/svc/v1/health" class="underline">Service</a></span>
    </nav>
  </header>

  <router-outlet></router-outlet>
  <footer class="mt-16 border-t border-slate-200 py-8 text-xs text-slate-500">Unified auth via api.berjis.tech cookies
  </footer>
</div>
